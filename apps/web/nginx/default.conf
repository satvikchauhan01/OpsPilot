# Only the console's static files. The ingress sends /api straight to the server.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Build assets have a content hash in their names, so they can be cached for good.
  location /assets/ {
    include conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Every other path belongs to the single-page app, whose router takes it from there.
  location / {
    include conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels:
    app.kubernetes.io/name: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
    spec:
      containers:
        - name: loadgen
          image: shop.local/loadgen:1.0.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TARGET_URL
              value: http://gateway.shop.svc.cluster.local
            - name: BASE_RPS
              value: "8"
            - name: CHECKOUT_SHARE
              value: "0.4"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi

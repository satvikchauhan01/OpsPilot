apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
# Read-only access for pod/node discovery and for cAdvisor metrics via the API server proxy
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opspilot-prometheus
rules:
  - apiGroups: [""]
    resources: [pods, nodes, nodes/proxy, nodes/metrics]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opspilot-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opspilot-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability

route:
  receiver: opspilot
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: opspilot
    webhook_configs:
      # Where OpsPilot listens and the token it expects both come from the
      # alertmanager-opspilot Secret, because they differ between environments.
      - url_file: /etc/opspilot/url
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/opspilot/token

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}

connectors:
  # Turns caller/callee span pairs into request metrics per edge (gateway -> checkout, ...).
  # OpsPilot builds its dependency graph and blast radius from these. The SDKs batch spans
  # for up to 5s, so the two halves of a call can arrive seconds apart. The TTL gives them
  # time to meet instead of being reported against an "unknown" peer.
  service_graph:
    latency_histogram_buckets: [50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
    metrics_flush_interval: 15s
    store:
      ttl: 20s
      max_items: 20000

exporters:
  otlp_grpc/tempo:
    endpoint: tempo.observability.svc.cluster.local:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki.observability.svc.cluster.local:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo, service_graph]
    metrics/service_graph:
      receivers: [service_graph]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]

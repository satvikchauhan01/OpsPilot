apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
---
# Only the resources the alert rules and OpsPilot need
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opspilot-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opspilot-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opspilot-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: observability

# The identity the demo control uses to break the shop on purpose and to put it back: patch
# Deployments (a bad release, restoring versions and replica counts, restarts) and call the
# fault-injection endpoint of shop pods and the load generator's control endpoint through
# the Kubernetes API. It is separate from the executor, which only ever runs approved fixes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opspilot-demo
  namespace: opspilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opspilot-demo
  namespace: shop
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods/proxy]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opspilot-demo
  namespace: shop
subjects:
  - kind: ServiceAccount
    name: opspilot-demo
    namespace: opspilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opspilot-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opspilot-demo
  namespace: loadgen
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods/proxy]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opspilot-demo
  namespace: loadgen
subjects:
  - kind: ServiceAccount
    name: opspilot-demo
    namespace: opspilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opspilot-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: opspilot-demo-token
  namespace: opspilot
  annotations:
    kubernetes.io/service-account.name: opspilot-demo
type: kubernetes.io/service-account-token

# OpenTelemetry settings shared by every shop service. Traces and logs go to the collector.
# Metrics are scraped by Prometheus directly, so the OTel metrics exporter stays off.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-telemetry
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none

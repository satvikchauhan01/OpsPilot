apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    app.kubernetes.io/name: payments
  annotations:
    kubernetes.io/change-cause: release 2.3.0
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: payments
          image: shop.local/payments:2.3.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: shop-telemetry
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=shop,k8s.deployment.name=payments,k8s.pod.name=$(POD_NAME)
            # Two processor connections per pod: plenty for normal traffic,
            # not enough for a flash sale unless the deployment is scaled out.
            - name: PROCESSOR_CONNECTIONS
              value: "2"
            - name: QUEUE_TIMEOUT_MS
              value: "1500"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  labels:
    app.kubernetes.io/name: payments
spec:
  selector:
    app.kubernetes.io/name: payments
  ports:
    - name: http
      port: 80
      targetPort: http
